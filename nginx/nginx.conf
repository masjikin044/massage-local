events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location / {
            proxy_pass http://frontend-user:80;
        }

        location /admin/ {
            proxy_pass http://frontend-admin:80/;
        }

        location /api/ {
            proxy_pass http://backend:5000/api/;
        }
    }
}