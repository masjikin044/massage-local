<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard - Local Message</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1e1e2f;
      color: #fff;
      padding: 15px;
    }
    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    h1 {
      font-size: 1.4rem;
      color: #4e73df;
    }
    /* Scroll horizontal otomatis jika tabel terlalu lebar di HP */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      background: #27293d;
      border-radius: 8px;
      padding: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 500px; /* Menjaga ukuran kolom minimal */
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #383a59;
    }
    th {
      background-color: #1d1e2c;
      color: #8f92a1;
    }
    @media (min-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }
      body {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⚙️ Admin Dashboard</h1>
      <button onclick="loadLogs()" style="padding: 8px 15px; border-radius: 5px; background: #4e73df; color: #fff; border: none; cursor: pointer;">Refresh</button>
    </header>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Pesan</th>
            <th>Waktu</th>
          </tr>
        </thead>
        <tbody id="adminTable">
          <tr>
            <td colspan="3">Memuat data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = '/api';

    async function loadLogs() {
      try {
        const res = await fetch(`${API_URL}/messages`);
        const data = await res.json();
        const tbody = document.getElementById('adminTable');
        if(data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3">Tidak ada data log.</td></tr>';
          return;
        }
        tbody.innerHTML = data.map((item, idx) => `
          <tr>
            <td>${item.id || idx + 1}</td>
            <td>${item.content || item.text || item}</td>
            <td>${item.created_at ? new Date(item.created_at).toLocaleString() : 'Baru saja'}</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    loadLogs();
  </script>
</body>
</html>
