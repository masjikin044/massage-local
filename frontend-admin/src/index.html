<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 30px; }
        
        h2 { font-size: 24px; font-weight: 600; margin-bottom: 20px; color: #38bdf8; }
        
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        .card h3 { font-size: 14px; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
        .card .value { font-size: 28px; font-weight: bold; color: #f1f5f9; }

        .grid-charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        
        .user-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .user-badge { background: #0284c7; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; }

        .msg-list { max-height: 250px; overflow-y: auto; margin-top: 10px; }
        .msg-item { background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .btn-del { background: #ef4444; border: none; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <h2>Admin Control & Monitoring Panel</h2>

    <div class="grid-stats">
        <div class="card">
            <h3>Total Users</h3>
            <div class="value" id="totalUsers">0</div>
        </div>
        <div class="card">
            <h3>Total Messages</h3>
            <div class="value" id="totalMessages">0</div>
        </div>
    </div>

    <div class="grid-charts">
        <div class="card">
            <h3>Grafik Pertumbuhan User</h3>
            <div id="chartUser"></div>
        </div>
        <div class="card">
            <h3>Grafik Aktivitas Pesan</h3>
            <div id="chartMessage"></div>
        </div>
    </div>

    <div class="grid-charts">
        <div class="card">
            <h3>User Terdaftar</h3>
            <div class="user-list" id="usersList"></div>
        </div>
        <div class="card">
            <h3>Manajemen Pesan</h3>
            <div class="msg-list" id="messagesList"></div>
        </div>
    </div>

<script>
    const API = 'http://' + window.location.hostname + ':5000/api';

    // Inisialisasi Grafik Modern ApexCharts
    const chartUserOptions = {
        chart: { type: 'area', height: 200, toolbar: { show: false }, sparkline: { enabled: false } },
        stroke: { curve: 'smooth', width: 2 },
        fill: { type: 'gradient', gradient: { opacityFrom: 0.5, opacityTo: 0 } },
        colors: ['#0284c7'],
        series: [{ name: 'User', data: [1, 2, 2, 3, 4] }],
        xaxis: { categories: ['10m ago', '8m ago', '6m ago', '4m ago', 'Now'], labels: { style: { colors: '#94a3b8' } } },
        theme: { mode: 'dark' }
    };

    const chartMessageOptions = {
        chart: { type: 'bar', height: 200, toolbar: { show: false } },
        colors: ['#22c55e'],
        plotOptions: { bar: { borderRadius: 4 } },
        series: [{ name: 'Pesan', data: [5, 12, 18, 24] }],
        xaxis: { categories: ['10m ago', '8m ago', '6m ago', 'Now'], labels: { style: { colors: '#94a3b8' } } },
        theme: { mode: 'dark' }
    };

    const chartUser = new ApexCharts(document.querySelector("#chartUser"), chartUserOptions);
    const chartMessage = new ApexCharts(document.querySelector("#chartMessage"), chartMessageOptions);
    chartUser.render();
    chartMessage.render();

    async function fetchStats() {
        try {
            const res = await fetch(`${API}/admin/stats`);
            const data = await res.json();
            
            document.getElementById('totalUsers').innerText = data.total_users;
            document.getElementById('totalMessages').innerText = data.total_messages;
            
            // Render Daftar Username
            document.getElementById('usersList').innerHTML = data.users_list.map(u => 
                `<span class="user-badge">@${u.username}</span>`
            ).join('');

            // Render Log Pesan + Tombol Hapus
            document.getElementById('messagesList').innerHTML = data.recent_messages.map(m => `
                <div class="msg-item">
                    <span><b>${m.sender}</b>: ${m.text}</span>
                    <button class="btn-del" onclick="deleteMessage(${m.id})">Hapus</button>
                </div>
            `).join('');

        } catch (err) { console.error("Gagal ambil data", err); }
    }

    async function deleteMessage(id) {
        await fetch(`${API}/messages/${id}`, { method: 'DELETE' });
        fetchStats();
    }

    fetchStats();
    setInterval(fetchStats, 3000);
</script>
</body>
</html>
