<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- SANGAT PENTING: Meta viewport agar layar HP bisa menyesuaikan ukuran secara rasional -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>User App - Local Message</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 15px;
    }
    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 15px;
      color: #2c3e50;
      text-align: center;
    }
    /* Layout Responsif (Flexbox) */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    input, textarea, button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      background-color: #007bff;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    .message-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message-card {
      background: #eef2f7;
      padding: 12px 15px;
      border-radius: 6px;
      border-left: 4px solid #007bff;
      word-wrap: break-word;
    }

    /* Penyesuaian Khusus Desktop (Layar > 600px) */
    @media (min-width: 600px) {
      body {
        padding: 40px 20px;
      }
      h1 {
        font-size: 2rem;
        text-align: left;
      }
      .form-group {
        flex-direction: row;
      }
      button {
        width: auto;
        min-width: 120px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 Local Message - User Portal</h1>
    <div class="form-group">
      <input type="text" id="msgInput" placeholder="Ketik pesan Anda di sini..." />
      <button onclick="sendMessage()">Kirim</button>
    </div>
    <h2>Daftar Pesan</h2>
    <div id="messages" class="message-list">
      <div class="message-card">Memuat pesan...</div>
    </div>
  </div>

  <script>
    // Menggunakan relative path agar otomatis menyesuaikan IP / Host saat diakses dari HP
    const API_URL = '/api';

    async function fetchMessages() {
      try {
        const res = await fetch(`${API_URL}/messages`);
        const data = await res.json();
        const container = document.getElementById('messages');
        if (data.length === 0) {
          container.innerHTML = '<div class="message-card">Belum ada pesan.</div>';
          return;
        }
        container.innerHTML = data.map(m => `<div class="message-card">${m.content || m.text || m}</div>`).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('msgInput');
      if (!input.value) return;
      try {
        await fetch(`${API_URL}/messages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: input.value })
        });
        input.value = '';
        fetchMessages();
      } catch (err) {
        alert('Gagal mengirim pesan');
      }
    }

    fetchMessages();
  </script>
</body>
</html>
