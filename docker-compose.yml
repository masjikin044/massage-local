version: '3.8'

services:
  backend:
    build: ./backend
    container_name: devops_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://user:password@postgres:5432/devops_db
      - REDIS_URL=redis://redis:6379
    # Otomatis menyalin .env.example jika .env belum ada sebelum server berjalan
    command: >
      sh -c "test -f .env || cp .env.example .env 2>/dev/null || true; node server.js"
    depends_on:
      - postgres
      - redis
    restart: always

  frontend-user:
    build: ./frontend-user
    container_name: devops_frontend_user
    ports:
      - "3000:80"
    restart: always

  frontend-admin:
    build: ./frontend-admin
    container_name: devops_frontend_admin
    ports:
      - "3001:80"
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: devops_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: devops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    container_name: devops_redis
    ports:
      - "6379:6379"
    restart: always

  nginx:
    build: ./nginx
    container_name: devops_nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend-user
      - frontend-admin
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: devops_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: devops_grafana
    ports:
      - "3002:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: always

volumes:
  postgres_data: